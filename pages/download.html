<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/media/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/media/apple-touch-icon.png">
<meta name="theme-color" content="#17332d">
<title>遊戲下載 - 曜川天堂</title>
<link rel="stylesheet" href="../assets/css/style.css">
<script src="../config.js"></script>
</head>
<body>
<div id="header-slot"></div>
<div id="nav-slot"></div>
<div id="main-wrap">
<div id="page-content">

<div class="page-hdr">
  <h1>📥 遊戲下載</h1>
  <p>主程式下載與安裝排錯說明</p>
</div>

<div id="js-download-content">載入中…</div>

</div>
</div>
<div id="footer-slot"></div>
<script src="../assets/js/forum.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var C = FORUM_CONFIG;
  var d = C.download;
  var downloadFiles = [
    { label: '載點一', title: '下載點一', url: d.mainUrl, note: '建議優先下載' },
    { label: '載點二', title: '下載點二', url: d.backup1, note: '備援載點' },
    { label: '載點三', title: '下載點三', url: d.backup2, note: '備援載點' }
  ].filter(function(file) { return file.url; });
  var downloadButtons = downloadFiles.map(function(file) {
    return '<a href="' + file.url + '" target="_blank" rel="noopener" style="display:block;text-decoration:none;background:#f3efe6;border:2px solid #a25335;border-radius:10px;padding:18px 16px;color:#18201e;text-align:center;box-shadow:0 2px 8px rgba(162,83,53,0.18);transition:transform .15s;">' +
      '<strong style="display:block;color:#a25335;font-size:1.35em;margin-bottom:6px;">' + file.title + '</strong>' +
      '<span style="display:inline-block;background:#17332d;color:#e8e3d8;border:1px solid rgba(162,83,53,0.55);padding:3px 12px;border-radius:999px;font-weight:bold;letter-spacing:1px;">' + file.label + '</span>' +
      '<p style="margin:10px 0 0;color:#4f5753;font-weight:bold;">' + file.note + '</p>' +
    '</a>';
  }).join('');
  document.getElementById('js-download-content').innerHTML = `
  <div style="
    font-family:'Microsoft JhengHei',sans-serif;color:#18201e;
    background:#e8e3d8;
    padding:30px;border:3px solid #a25335;border-radius:15px;
    box-shadow:0 2px 16px rgba(162,83,53,0.15);max-width:950px;margin:0 auto;line-height:1.6;">

    <h2 style="color:#a25335;border-bottom:4px double #a25335;padding-bottom:15px;margin-top:0;text-align:center;font-size:2.2em;">
      遊戲下載
    </h2>

    <!-- 主程式下載 -->
    <div style="background:#fff;border:2px solid #a25335;border-radius:10px;padding:22px;margin-bottom:30px;">
      <div style="text-align:center;margin-bottom:18px;">
        <strong style="color:#a25335;font-size:1.55em;letter-spacing:2px;">曜川天堂最新懶人包下載</strong>
        <p style="margin:8px 0 0;color:#4f5753;font-weight:bold;">更新日期：${d.updateDate || '最新版本'}</p>
        <p style="margin:4px 0 0;color:#4f5753;">三個載點內容相同，任選一個下載即可；若某個載點無法開啟，請改用其他載點。</p>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;">
        ${downloadButtons || '<p style="text-align:center;color:#a25335;font-weight:bold;margin:0;">下載連結準備中，請稍後再試。</p>'}
      </div>
    </div>

    <!-- 官方代客下載 -->
    <div style="background:#17332d;border:2px solid #a25335;border-radius:10px;padding:20px;margin-bottom:30px;display:flex;align-items:center;gap:20px;">
      <span style="font-size:3em;">❤️</span>
      <div style="flex:1;">
        <strong style="color:#e8e3d8;font-size:1.4em;">官方代客下載服務</strong>
        <p style="margin:5px 0 0 0;color:#e8e3d8;font-weight:bold;">
          考量部分玩家不熟悉安裝流程，我們提供 <span style="color:#a25335;font-size:1.1em;">「代客遠端安裝」</span> 服務！請洽詢官方 LINE@ 由小編協助。
        </p>
        <div style="margin:15px 0;">
          <span style="font-size:0.95em;color:#e8e3d8;">🛡️ 遠端協助請先準備好：</span>
          <a href="${d.anyDeskUrl}" target="_blank" style="background:#1e88e5;color:#fff;padding:8px 15px;text-decoration:none;border-radius:5px;font-weight:bold;margin-left:10px;display:inline-block;">📥 下載 AnyDesk</a>
        </div>
        <a href="javascript:void(0)" onclick="window.open(FORUM_CONFIG.lineOfficial,'_blank')" style="background:#06c755;color:#fff;padding:10px 25px;text-decoration:none;border:2px solid #fff;border-radius:5px;font-weight:bold;font-size:1.1em;display:inline-block;">👉 點我聯絡官方 LINE@</a>
      </div>
    </div>

    <hr style="border:0;border-top:2px double #a25335;margin:40px 0;">

    <!-- 防毒排除 -->
    <h3 style="color:#ff4500;border-left:10px solid #ff4500;padding-left:15px;font-size:1.6em;background:rgba(255,69,0,0.1);">🛡️ 登入器遺失 / 防毒排除設定</h3>
    <p style="color:#a25335;font-weight:bold;margin-bottom:20px;">若登入器被防毒誤刪，請照以下四個步驟將資料夾加入排除項目：</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:25px;">
      <div style="border:2px solid #a25335;padding:15px;border-radius:10px;background:#f3efe6;">
        <strong style="color:#a25335;">步驟 1：開啟 Windows 安全性</strong><br>
        <span style="font-size:0.95em;color:#4f5753;">進入「病毒與威脅防護」</span>
        <img src="https://telegraph-image-1n0.pages.dev/file/AgACAgUAAyEGAAS3SV8sAAICammDZg5khRUafp4yxFaiUeT_tXOAAALWD2sbTP4YVBh66GyGDN5hAQADAgADdwADOAQ.png" style="width:100%;margin-top:10px;border-radius:5px;border:1px solid #a25335;">
      </div>
      <div style="border:2px solid #a25335;padding:15px;border-radius:10px;background:#f3efe6;">
        <strong style="color:#a25335;">步驟 2：進入管理設定</strong><br>
        <span style="font-size:0.95em;color:#4f5753;">點選「管理設定」連結</span>
        <img src="https://telegraph-image-1n0.pages.dev/file/AgACAgUAAyEGAAS3SV8sAAICa2mDZkS5jLHwMviaplc_LvSZ5myGAALXD2sbTP4YVBripGgTiMf2AQADAgADeAADOAQ.png" style="width:100%;margin-top:10px;border-radius:5px;border:1px solid #a25335;">
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:25px;">
      <div style="border:2px solid #a25335;padding:15px;border-radius:10px;background:#f3efe6;">
        <strong style="color:#a25335;">步驟 3：新增排除項目</strong><br>
        <span style="font-size:0.95em;color:#4f5753;">移至最下方點選「新增或移除排除項目」</span>
        <img src="https://telegraph-image-1n0.pages.dev/file/AgACAgUAAyEGAAS3SV8sAAICbGmDZnoFi6UH_5WoVnkO9UJPr5y-AALYD2sbTP4YVEiR1cqXZWZlAQADAgADeQADOAQ.png" style="width:100%;margin-top:10px;border-radius:5px;border:1px solid #a25335;">
      </div>
      <div style="border:2px solid #a25335;padding:15px;border-radius:10px;background:#f3efe6;">
        <strong style="color:#a25335;">步驟 4：選擇資料夾</strong><br>
        <span style="font-size:0.95em;color:#4f5753;">選擇「曜川天堂」資料夾，重新解壓縮或使用輔助工具復原登入器即可</span>
        <img src="../assets/media/download/defender-exclusion-folder.png" style="width:100%;margin-top:10px;border-radius:5px;border:1px solid #a25335;">
      </div>
    </div>

  </div>`;
});
</script>
</body>
</html>
